[project]
name = "aibridge"
version = "0.1.0"
description = "Bridge web-only AI providers (Monica, Perplexity) to OpenAI-compatible API via Camoufox"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yudha Harsanto", email = "yudha.harsantoo@gmail.com" }]
keywords = ["ai", "proxy", "camoufox", "monica", "perplexity", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: Proxy Servers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "camoufox[geoip]>=0.4.11",
  "playwright>=1.48",
  "aiohttp>=3.9",
  "tomli>=2.0;python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/yudhaharsanto/aibridge"
Repository = "https://github.com/yudhaharsanto/aibridge"
Issues = "https://github.com/yudhaharsanto/aibridge/issues"

[project.scripts]
aibridge = "aibridge.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aibridge*"]
