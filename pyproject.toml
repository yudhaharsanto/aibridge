[project]
name = "aibridge"
version = "0.1.0"
description = "Bridge web-only AI providers (Monica, Perplexity) to OpenAI-compatible API via Camoufox"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yudha" }]
keywords = ["ai", "proxy", "camoufox", "monica", "perplexity"]

dependencies = [
  "camoufox[geoip]>=0.4.11",
  "playwright>=1.48",
  "aiohttp>=3.9",
  "tomli>=2.0;python_version<'3.11'",
]

[project.scripts]
aibridge = "aibridge.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aibridge*"]
